name: THIN-CORE-001 VERIFY-1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e . pytest
      - name: Execute existing VERIFY-1 tests
        run: python -m pytest -q tests/test_thin_core.py
      - name: Execute P2P tests
        run: python -m pytest -q tests/test_p2p.py
